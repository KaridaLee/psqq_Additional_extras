# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: psqq_item

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '7.6.2'
      
    # 添加执行权限 (只需要一次)
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
    
    # 清理缓存
    - name: Clean Gradle Cache
      run: |
        ./gradlew clean
        rm -rf ~/.gradle/caches/
    
    # 构建项目
    - name: Build with Gradle
      run: ./gradlew build
      
    # 找到构建的JAR文件
    - name: Find JAR file
      id: find-jar
      run: |
        JAR_FILE=$(find build/libs -name "*.jar" -not -name "*-sources.jar" -not -name "*-dev.jar" | head -n 1)
        
        if [ -z "$JAR_FILE" ]; then
          echo "No JAR file found!"
          exit 1
        fi
        
        echo "Found JAR file: $JAR_FILE"
        echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT
        
    # 生成版本标签
    - name: Generate version
      id: generate_version
      run: |
        TIMESTAMP=$(date +'%Y%m%d')
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "version=v${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT
      
    # 创建Release并上传JAR
    - name: Create Release and Upload JAR
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.generate_version.outputs.version }}
        name: "Build ${{ steps.generate_version.outputs.version }}"
        files: ${{ steps.find-jar.outputs.jar_path }}
        draft: false
        prerelease: false
